
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple and productive To-Do List application to manage daily tasks.">
    <title>FocusList | To-Do App</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <main class="app-container">
        <header class="app-header">
            <p class="eyebrow">YOUR PERSONAL PRODUCTIVITY SPACE</p>
            <h1>FocusList<span>.</span></h1>
            <p class="subtitle">Organize your day, one task at a time.</p>
        </header>

        <section class="todo-card" aria-label="To-do list">

            <form id="todo-form">
                <label for="todo-input">What needs to be done?</label>
                <div class="input-group">
                    <input
                        type="text"
                        id="todo-input"
                        placeholder="Enter your task..."
                        maxlength="150"
                        required
                    >
                    <button type="submit" id="add-btn">Add Task</button>
                </div>
            </form>

            <div class="task-summary">
                <p id="task-count" aria-live="polite">0 tasks remaining</p>
                <button type="button" id="clear-completed">
                    Clear completed
                </button>
            </div>

            <nav class="filter-buttons" aria-label="Filter tasks">
                <button type="button" class="filter-btn active" data-filter="all">
                    All
                </button>
                <button type="button" class="filter-btn" data-filter="active">
                    Active
                </button>
                <button type="button" class="filter-btn" data-filter="completed">
                    Completed
                </button>
            </nav>

            <ul id="todo-list" class="todo-list" aria-label="Your tasks">
            </ul>

            <p id="empty-message" class="empty-message">
                No tasks yet. Add your first task!
            </p>

        </section>

        <footer>
            <p>Stay focused. Make progress. ✨</p>
        </footer>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
